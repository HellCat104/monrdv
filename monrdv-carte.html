<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:420px;height:592px}
  body{font-family:'Poppins',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{position:relative;width:420px;height:592px;background:#fff;overflow:hidden;display:flex;flex-direction:column;padding:36px 32px}
  .pulse{position:absolute;left:0;right:0;top:208px;opacity:.06;stroke:#0EA5E9;fill:none;stroke-width:6}
  .brand{display:flex;align-items:center;gap:13px}
  .m{width:62px;height:62px;border-radius:18px;background:linear-gradient(150deg,#38bdf8,#0EA5E9 55%,#0369a1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;box-shadow:0 12px 30px rgba(14,165,233,.35)}
  .brand .w{font-size:30px;font-weight:800;color:#0f2230;letter-spacing:-.02em}
  .brand .w b{color:#0EA5E9}
  .kicker{margin-top:30px;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#0EA5E9}
  .acc{margin-top:12px;font-size:31px;font-weight:800;line-height:1.12;color:#0f2230;letter-spacing:-.01em}
  .acc .l{color:#0EA5E9}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .chip{font-size:12px;font-weight:600;color:#0369a1;background:#f0f9ff;border:1px solid #e0f2fe;border-radius:999px;padding:7px 13px}
  .spacer{flex:1}
  .band{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(135deg,#0EA5E9,#0369a1);padding:22px 32px;color:#fff}
  .band .url{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700}
  .band .url svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
  .wa{display:flex;align-items:center;gap:11px;margin-top:13px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:11px 14px}
  .wa .ic{width:30px;height:30px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .wa .ic svg{width:18px;height:18px;fill:#fff}
  .wa .t{font-size:11px;color:#e0f2fe;font-weight:500;line-height:1.2}
  .wa .t b{display:block;font-size:17px;color:#fff;font-weight:700;letter-spacing:.02em}
</style>
</head>
<body>
  <div class="card">
    <svg class="pulse" viewBox="0 0 420 60" preserveAspectRatio="none"><polyline points="0,30 120,30 150,30 175,6 200,54 225,30 290,30 320,30 345,10 370,30 420,30"/></svg>
    <div class="brand"><div class="m">M</div><div class="w">Mon<b>RDV</b></div></div>
    <div class="kicker">Pour les médecins</div>
    <div class="acc">Digitalisez votre cabinet en <span class="l">5 minutes</span>.</div>
    <div class="chips"><span class="chip">Réservation en ligne</span><span class="chip">Rappels auto</span><span class="chip">Dossiers &amp; factures</span></div>
    <div class="spacer"></div>
    <div class="band">
      <div class="url"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg> www.monrdv.co.ma</div>
      <div class="wa"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.4A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.2-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.4 0 .5l-.4.6c-.2.2-.3.4-.1.7.2.3.9 1.4 1.9 2.3 1.3 1.1 2.3 1.5 2.6 1.6.3.1.5.1.7-.1l.8-1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.6.3.1.2.1.7-.1 1.2Z"/></svg></div><div class="t">WhatsApp<b>+212 6 XX XX XX XX</b></div></div>
    </div>
  </div>
</body>
</html>
